<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Μάθημα 21: Εξερευνητές του Διαδικτύου</title>
<style>
:root{
  --bg:#f0f4ff;
  --main:#4f46e5;
  --main-dark:#3730a3;
  --accent:#06b6d4;
  --card-bg:#ffffff;
  --text:#1e1b4b;
  --text-muted:#64748b;
  --success:#10b981;
  --success-bg:#ecfdf5;
  --warn:#f59e0b;
  --warn-bg:#fffbeb;
  --danger:#ef4444;
  --danger-bg:#fef2f2;
  --radius:16px;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  padding:16px 12px 50px;
}
.container{max-width:920px;margin:0 auto}

/* HEADER */
.hero{
  background:linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
  color:#fff;
  border-radius:var(--radius);
  padding:22px 20px;
  display:flex;
  align-items:center;
  gap:16px;
  box-shadow:0 10px 25px -5px rgba(79,70,229,.35);
  margin-bottom:22px;
}
.hero-icon{
  width:58px;height:58px;background:rgba(255,255,255,.2);
  border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:30px;flex-shrink:0;backdrop-filter:blur(4px);
}
.hero h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px}
.hero p{margin:4px 0 0;font-size:13.5px;opacity:.92}

/* CARDS GRID */
#gridMenu{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:15px}
.mission-card{
  background:var(--card-bg);
  border-radius:var(--radius);
  padding:18px 16px;
  border:2px solid transparent;
  cursor:pointer;
  transition:all .2s ease;
  box-shadow:0 4px 12px rgba(30,27,75,.05);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.mission-card:hover{
  border-color:var(--accent);
  transform:translateY(-3px);
  box-shadow:0 12px 24px rgba(79,70,229,.15);
}
.m-badge{
  width:32px;height:32px;border-radius:10px;background:var(--main);
  color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;
  font-size:13px;margin-bottom:10px;
}
.mission-card h3{margin:0 0 6px;font-size:15px;color:var(--text);font-weight:700}
.mission-card p{margin:0 0 12px;font-size:12.5px;color:var(--text-muted);line-height:1.35}
.m-tag{
  align-self:flex-start;
  padding:4px 10px;background:#e0e7ff;color:var(--main);
  border-radius:20px;font-size:11.5px;font-weight:700;
}

/* PLAYGROUND / ACTIVE MISSION */
#actBox{
  background:var(--card-bg);
  border-radius:var(--radius);
  padding:22px;
  box-shadow:0 8px 24px rgba(0,0,0,.06);
}
.nav-bar{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;
}
.btn-return{
  background:#f1f5f9;border:none;color:var(--text);
  padding:8px 16px;border-radius:10px;font-weight:700;
  cursor:pointer;font-size:13px;transition:.15s;
}
.btn-return:hover{background:#e2e8f0}
.instruction-banner{
  background:#f8fafc;border-left:5px solid var(--accent);
  padding:12px 16px;border-radius:0 10px 10px 0;
  margin-bottom:18px;font-size:14px;color:#334155;line-height:1.45;
}

/* BROWSER SIMULATOR */
.mock-browser{
  background:#ffffff;
  border:2px solid #cbd5e1;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.06);
  margin-bottom:16px;
}
.mock-toolbar{
  background:#f1f5f9;
  padding:8px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid #e2e8f0;
}
.browser-controls{display:flex;gap:5px}
.b-dot{width:11px;height:11px;border-radius:50%;background:#cbd5e1}
.b-dot.red{background:#f87171}
.b-dot.yellow{background:#fbbf24}
.b-dot.green{background:#34d399}
.url-bar-container{
  flex:1;
  background:#fff;
  border:1px solid #cbd5e1;
  border-radius:20px;
  padding:6px 14px;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13.5px;
}
.lock-icon{font-size:13px;color:#059669}
.url-input{
  flex:1;border:none;outline:none;font-family:inherit;font-size:13.5px;color:#0f172a;
}
.url-go-btn{
  background:var(--main);color:#fff;border:none;border-radius:14px;
  padding:5px 14px;font-weight:700;font-size:12.5px;cursor:pointer;
}
.mock-page-content{
  padding:24px 20px;min-height:150px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;background:#fff;
}

/* INTERACTIVE COMPONENTS */
.chips-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip-btn{
  background:#f1f5f9;border:2px solid #e2e8f0;border-radius:20px;
  padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;
  transition:all .15s ease;
}
.chip-btn:hover{border-color:var(--main);background:#e0e7ff;color:var(--main)}
.chip-btn.sel{background:var(--main);color:#fff;border-color:var(--main)}

.grid-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}
.choice-box{
  background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;
  padding:14px;cursor:pointer;text-align:center;font-weight:700;font-size:13.5px;
  transition:.15s;
}
.choice-box:hover{border-color:var(--accent);background:#f0fdfa}
.choice-box.active{border-color:var(--main);background:#e0e7ff;color:var(--main)}
.choice-box.correct{border-color:var(--success);background:var(--success-bg);color:var(--success)}
.choice-box.wrong{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}

/* DETECTIVE CHECKLIST */
.checklist-item{
  background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;
  padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;
  justify-content:space-between;cursor:pointer;font-size:13.5px;
}
.checklist-item.checked{background:var(--success-bg);border-color:var(--success);color:#065f46;font-weight:700}

/* FEEDBACK & ACTIONS */
.feedback-box{
  padding:12px 16px;border-radius:10px;font-weight:700;font-size:14px;
  margin:14px 0;display:none;
}
.feedback-box.good{background:var(--success-bg);color:#065f46;border:1px solid #a7f3d0}
.feedback-box.bad{background:var(--danger-bg);color:#991b1b;border:1px solid #fecaca}
.action-cta{
  background:linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
  color:#fff;border:none;padding:12px 24px;border-radius:12px;
  font-size:14px;font-weight:800;cursor:pointer;margin-top:14px;
}
.action-cta:hover{opacity:.95}
</style>
</head>
<body>
<div class="container">
  <!-- HERO HEADER -->
  <div class="hero">
    <div class="hero-icon">🌐</div>
    <div>
      <h1>Μάθημα 21: Εξερευνητές του Διαδικτύου</h1>
      <p>Γραμμή διευθύνσεων, διευθύνσεις ιστοσελίδων (URL) και κριτήρια αξιοπιστίας — Ε΄ Δημοτικού</p>
    </div>
  </div>

  <!-- MENU VIEW -->
  <div id="gridMenu"></div>

  <!-- ACTIVE MISSION VIEW -->
  <div id="actBox" style="display:none">
    <div class="nav-bar">
      <button class="btn-return" onclick="showMenu()">← Επιστροφή στο Μενού</button>
      <span id="missionBadge" class="m-tag">Αποστολή</span>
    </div>
    <div class="instruction-banner" id="bannerDesc"></div>
    <div id="missionWorkspace"></div>
    <div class="feedback-box" id="fbMsg"></div>
    <div id="nextArea"></div>
  </div>
</div>

<script>
var curIndex = 0;

var missions = [
  // 1. Γραμμή Διευθύνσεων (Address Bar Simulator)
  {
    title: "1. Η Γραμμή Διευθύνσεων",
    desc: "Πληκτρολόγησε απευθείας τη διεύθυνση URL για να επισκεφτείς έναν ιστότοπο.",
    instruction: "<b>Αποστολή:</b> Όταν γνωρίζουμε την ακριβή διεύθυνση μιας ιστοσελίδας, τη γράφουμε στη <b>γραμμή διευθύνσεων</b>! Πληκτρολόγησε <b>https://copyrightschool.gr/</b> (ή πάτα το κουμπί 'Αυτόματη συμπλήρωση') και πάτα <b>Enter ↵</b>.",
    setup: function(box) {
      box.innerHTML = 
        '<div class="mock-browser">' +
          '<div class="mock-toolbar">' +
            '<div class="browser-controls"><span class="b-dot red"></span><span class="b-dot yellow"></span><span class="b-dot green"></span></div>' +
            '<div class="url-bar-container">' +
              '<span class="lock-icon">🔒</span>' +
              '<input type="text" class="url-input" id="browserUrl" placeholder="Πληκτρολόγησε τη διεύθυνση URL εδώ..." />' +
              '<button class="url-go-btn" onclick="visitUrl()">Μετάβαση ➔</button>' +
            '</div>' +
          '</div>' +
          '<div class="mock-page-content" id="pageDisplay">' +
            '<div style="font-size:40px;margin-bottom:8px">🌍</div>' +
            '<div style="font-weight:700;color:#64748b">Ο φυλλομετρητής περιμένει διεύθυνση...</div>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;gap:8px">' +
          '<button class="btn-return" onclick="fillUrl(\'https://copyrightschool.gr/\')">✨ Αυτόματη συμπλήρωση</button>' +
        '</div>';

      document.getElementById("browserUrl").addEventListener("keydown", function(e) {
        if (e.key === "Enter") visitUrl();
      });
    }
  },

  // 2. Ανατομία μιας Διεύθυνσης URL
  {
    title: "2. Ανατομία ενός URL",
    desc: "Μάθε τα 3 βασικά τμήματα από τα οποία αποτελείται μια διεύθυνση.",
    instruction: "<b>Αποστολή:</b> Δες τη διεύθυνση <b>https://copyrightschool.gr/</b> (σελ. 78). Πάτησε πάνω στα <b>3 σωστά κομμάτια</b> από τα οποία αποτελείται κάθε διεύθυνση ιστότοπου!",
    setup: function(box) {
      box.innerHTML = 
        '<div style="background:#e0e7ff;padding:16px;border-radius:12px;text-align:center;font-size:16px;font-family:monospace;font-weight:bold;color:#3730a3;margin-bottom:14px">' +
        'https://copyrightschool.gr/' +
        '</div>' +
        '<div class="grid-choices" id="urlPartsGrid">' +
          '<div class="choice-box" onclick="pickUrlPart(this, true)">🔒 Αρχίζει με https:// (πρωτόκολλο ασφάλειας)</div>' +
          '<div class="choice-box" onclick="pickUrlPart(this, false)">🎨 Το αγαπημένο χρώμα της ιστοσελίδας</div>' +
          '<div class="choice-box" onclick="pickUrlPart(this, true)">🌐 Όνομα δικτυακού τόπου (copyrightschool)</div>' +
          '<div class="choice-box" onclick="pickUrlPart(this, false)">🔋 Το επίπεδο μπαταρίας του υπολογιστή</div>' +
          '<div class="choice-box" onclick="pickUrlPart(this, true)">📍 Τελειώνει με κατάληξη (π.χ. .gr για Ελλάδα)</div>' +
        '</div>';
    }
  },

  // 3. Το Μυστικό των Καταλήξεων (.gr, .gov, .edu, .org, .com)
  {
    title: "3. Οι Καταλήξεις των Ιστοσελίδων",
    desc: "Αντιστοίχισε τις καταλήξεις με το είδος του οργανισμού.",
    instruction: "<b>Αποστολή:</b> Η κατάληξη στο τέλος μιας διεύθυνσης μας δίνει πολύτιμες πληροφορίες (σελ. 78). Πάτησε πρώτα μία <b>κατάληξη</b> στα αριστερά και μετά τη <b>σημασία</b> της στα δεξιά!",
    setup: function(box) {
      box.innerHTML = 
        '<div style="display:flex;gap:16px;flex-wrap:wrap">' +
          '<div style="flex:1;min-width:180px">' +
            '<h4 style="margin:0 0 8px;font-size:13px;color:#64748b">ΚΑΤΑΛΗΞΗ:</h4>' +
            '<div class="choice-box" id="ext_gov" onclick="selectExt(\'gov\')">🏛️ .gov / .gov.gr</div>' +
            '<div class="choice-box" id="ext_edu" onclick="selectExt(\'edu\')">🎓 .edu / .edu.gr</div>' +
            '<div class="choice-box" id="ext_org" onclick="selectExt(\'org\')">🤝 .org</div>' +
            '<div class="choice-box" id="ext_com" onclick="selectExt(\'com\')">💼 .com</div>' +
          '</div>' +
          '<div style="flex:1;min-width:180px">' +
            '<h4 style="margin:0 0 8px;font-size:13px;color:#64748b">ΣΗΜΑΣΙΑ:</h4>' +
            '<div class="choice-box" id="def_gov" onclick="selectDef(\'gov\')">Κυβέρνηση & Δημόσιες Υπηρεσίες</div>' +
            '<div class="choice-box" id="def_edu" onclick="selectDef(\'edu\')">Εκπαίδευση & Σχολεία/Πανεπιστήμια</div>' +
            '<div class="choice-box" id="def_org" onclick="selectDef(\'org\')">Μη κερδοσκοπικός Οργανισμός</div>' +
            '<div class="choice-box" id="def_com" onclick="selectDef(\'com\')">Εμπορική Εταιρεία / Επιχείρηση</div>' +
          '</div>' +
        '</div>';
    }
  },

  // 4. Σκέψεις του Ήρωνα: Σωστό ή Λάθος; (σελ. 78)
  {
    title: "4. Ο Ήρωνας Ελέγχει Διευθύνσεις",
    desc: "Βοήθησε τον Ήρωνα να ελέγξει αν οι σκέψεις του για τα site είναι σωστές.",
    instruction: "<b>Αποστολή:</b> Ο Ήρωνας διάβασε τις καταλήξεις σε 4 γνωστές ιστοσελίδες (σελ. 78 του βιβλίου). Αποφάσισε αν κάθε σκέψη του είναι <b>ΣΩΣΤΗ</b> ή <b>ΛΑΘΟΣ</b>!",
    setup: function(box) {
      currentHeroQ = 0;
      renderHeroQuiz(box);
    }
  },

  // 5. Ο Μεγεθυντικός Φακός του Ντετέκτιβ (Κριτήρια Αξιοπιστίας)
  {
    title: "5. Κριτήρια Αξιοπιστίας Ιστότοπου",
    desc: "Έλεγξε αν ένας ιστότοπος είναι ασφαλής και αξιόπιστος.",
    instruction: "<b>Αποστολή:</b> Η Υπατία ρωτάει: 'Είναι ασφαλές; Μπορώ να το εμπιστευτώ;' (σελ. 79). Εντόπισε τα <b>4 βασικά κριτήρια ελέγχου</b> κάνοντας κλικ επάνω τους!",
    setup: function(box) {
      box.innerHTML = 
        '<p style="font-size:13.5px;color:#475569;margin-bottom:12px">Επίλεξε τα 4 σωστά κριτήρια αξιολόγησης ενός ιστοτόπου:</p>' +
        '<div id="criteriaList">' +
          '<div class="checklist-item" onclick="toggleCrit(this, true)">🔍 <b>Δημιουργός:</b> Σε ποιον ανήκει ο ιστότοπος και ποιος έγραψε το άρθρο;</div>' +
          '<div class="checklist-item" onclick="toggleCrit(this, false)">🎨 <b>Χρώματα:</b> Αν έχει πολλά έντονα σχέδια και κινούμενες διαφημίσεις</div>' +
          '<div class="checklist-item" onclick="toggleCrit(this, true)">📅 <b>Ενημερωμένη πληροφορία:</b> Πότε γράφτηκε; Είναι πρόσφατη η ημερομηνία;</div>' +
          '<div class="checklist-item" onclick="toggleCrit(this, false)">⚡ <b>Ταχύτητα:</b> Αν φορτώνει σε λιγότερο από μισό δευτερόλεπτο</div>' +
          '<div class="checklist-item" onclick="toggleCrit(this, true)">📖 <b>Κατάλληλη γλώσσα:</b> Έχει σωστή ορθογραφία και κατανοητό περιεχόμενο;</div>' +
          '<div class="checklist-item" onclick="toggleCrit(this, true)">🎯 <b>Σχετικό περιεχόμενο:</b> Είναι αυτό που πραγματικά ψάχνουμε για την εργασία μας;</div>' +
        '</div>';
    }
  },

  // 6. Εργαστήριο Ελέγχου: Copyright School (σελ. 79)
  {
    title: "6. Έλεγχος του CopyrightSchool.gr",
    desc: "Εφάρμοσε τα κριτήρια στον επίσημο εκπαιδευτικό ιστότοπο.",
    instruction: "<b>Αποστολή:</b> Εξέτασε τον δικτυακό τόπο <b>https://copyrightschool.gr/</b> (σελ. 79) και συμπλήρωσε την ψηφιακή ταυτότητα ελέγχου του!",
    setup: function(box) {
      box.innerHTML = 
        '<div style="background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:16px;margin-bottom:14px">' +
          '<div style="font-size:15px;font-weight:bold;color:var(--main);margin-bottom:8px">🌐 Ιστότοπος: CopyrightSchool.gr</div>' +
          '<p style="font-size:13px;color:#475569;margin:0 0 12px">Επίσημος ιστότοπος για την πνευματική ιδιοκτησία στα σχολεία, υπό την αιγίδα του Οργανισμού Πνευματικής Ιδιοκτησίας (ΟΠΙ).</p>' +
          '<div style="display:flex;flex-direction:column;gap:8px">' +
            '<div class="checklist-item" id="cs1" onclick="checkSiteFact(\'cs1\')">1. Δημιουργός: Ανήκει σε επίσημο οργανισμό (ΟΠΙ) ⬜</div>' +
            '<div class="checklist-item" id="cs2" onclick="checkSiteFact(\'cs2\')">2. Κατάληξη .gr: Σχετίζεται επίσημα με την Ελλάδα ⬜</div>' +
            '<div class="checklist-item" id="cs3" onclick="checkSiteFact(\'cs3\')">3. Ασφάλεια https://: Έχει πράσινο λουκέτο ασφαλείας ⬜</div>' +
            '<div class="checklist-item" id="cs4" onclick="checkSiteFact(\'cs4\')">4. Περιεχόμενο: Ειδικά γραμμένο για μαθητές και εκπαιδευτικούς ⬜</div>' +
          '</div>' +
        '</div>';
    }
  },

  // 7. Παιχνίδι: Ασφαλές ή Ύποπτο;
  {
    title: "7. Παιχνίδι: Ασφαλές ή Ύποπτο;",
    desc: "Εντόπισε ποιοι ιστότοποι είναι αξιόπιστοι και ποιοι κρύβουν κινδύνους.",
    instruction: "<b>Αποστολή:</b> Δες την κάρτα της ιστοσελίδας και πάτησε <b>«✅ Ασφαλές»</b> ή <b>«⚠️ Ύποπτο»</b>!",
    setup: function(box) {
      curSafeQ = 0;
      renderSafeQuiz(box);
    }
  },

  // 8. Τελικό Master Quiz Εξερευνητή
  {
    title: "8. Το Μεγάλο Master Quiz",
    desc: "Ολοκλήρωσε το μάθημα 21 και απόκτησε το Σήμα Έμπειρου Πλοηγού!",
    instruction: "<b>Αποστολή:</b> Απάντησε σωστά στις 3 βασικές ερωτήσεις εμπέδωσης του μαθήματος 21!",
    setup: function(box) {
      curFinalQ = 0;
      finalScore = 0;
      renderFinalQuiz(box);
    }
  }
];

function initMenu() {
  var menu = document.getElementById("gridMenu");
  menu.innerHTML = "";
  missions.forEach(function(m, idx) {
    var c = document.createElement("div");
    c.className = "mission-card";
    c.onclick = function() { loadMission(idx); };
    c.innerHTML = 
      '<div>' +
        '<div class="m-badge">' + (idx + 1) + '</div>' +
        '<h3>' + m.title + '</h3>' +
        '<p>' + m.desc + '</p>' +
      '</div>' +
      '<span class="m-tag">Ξεκίνα ➔</span>';
    menu.appendChild(c);
  });
}

function showMenu() {
  document.getElementById("gridMenu").style.display = "grid";
  document.getElementById("actBox").style.display = "none";
}

function loadMission(idx) {
  curIndex = idx;
  var m = missions[idx];
  document.getElementById("gridMenu").style.display = "none";
  document.getElementById("actBox").style.display = "block";

  document.getElementById("missionBadge").textContent = "Αποστολή " + (idx + 1) + " / " + missions.length;
  document.getElementById("bannerDesc").innerHTML = m.instruction;

  var fb = document.getElementById("fbMsg");
  fb.textContent = "";
  fb.style.display = "none";
  document.getElementById("nextArea").innerHTML = "";

  var ws = document.getElementById("missionWorkspace");
  ws.innerHTML = "";
  m.setup(ws);
}

function setSuccess(msg) {
  var fb = document.getElementById("fbMsg");
  fb.textContent = msg;
  fb.className = "feedback-box good";
  fb.style.display = "block";

  var nextArea = document.getElementById("nextArea");
  if (!nextArea.hasChildNodes()) {
    var nb = document.createElement("button");
    nb.className = "action-cta";
    if (curIndex < missions.length - 1) {
      nb.textContent = "Επόμενη Αποστολή ▶";
      nb.onclick = function() { loadMission(curIndex + 1); };
    } else {
      nb.textContent = "🎉 Συγχαρητήρια! Ολοκλήρωσες το Μάθημα 21! Επιστροφή στο Μενού";
      nb.onclick = showMenu;
    }
    nextArea.appendChild(nb);
  }
}

function setError(msg) {
  var fb = document.getElementById("fbMsg");
  fb.textContent = msg;
  fb.className = "feedback-box bad";
  fb.style.display = "block";
}

}
function visitUrl() {
  var val = document.getElementById("browserUrl").value.trim().toLowerCase();
  var disp = document.getElementById("pageDisplay");
  if (val.indexOf("copyrightschool.gr") !== -1) {
    disp.innerHTML = 
      '<div style="font-size:42px;margin-bottom:8px">📚⚖️</div>' +

    setError("✗ Πληκτρολόγησε https://copyrightschool.gr/ στη γραμμή διευθύνσεων ή πάτα το κουμπί 'Αυτόματη συμπλήρωση'.");

  if (el.classList.contains("correct") || el.classList.contains("wrong")) return;

    el.classList.add("correct");
    selectedPartsCount++;
    if (selectedPartsCount >= 3) {
      setSuccess("🎉 Εξαιρετικά! Ένα URL έχει 3 βασικά μέρη: το πρωτόκολλο https://, το όνομα του ιστοτόπου και την κατάληξη (.gr)!");
    }
  } else {
    el.classList.add("wrong");
    setError("✗ Αυτό το στοιχείο δεν ανήκει στη διεύθυνση URL! Δοκίμασε άλλη επιλογή.");
  }
}

// Mission 3
var curSelExt = null;
var matchedExtCount = 0;
function selectExt(ext) {
  curSelExt = ext;
  document.querySelectorAll("[id^='ext_']").forEach(function(el){ el.classList.remove("active"); });
  document.getElementById("ext_" + ext).classList.add("active");
}
function selectDef(def) {
  if (!curSelExt) {
    setError("✗ Πρώτα διάλεξε μία κατάληξη από τα αριστερά!");
    return;
  }
  if (curSelExt === def) {
    document.getElementById("ext_" + def).classList.add("correct");
    document.getElementById("def_" + def).classList.add("correct");
    matchedExtCount++;
    curSelExt = null;
    if (matchedExtCount >= 4) {
      setSuccess("🎉 Μπράβο! Αντιστοίχισες όλες τις καταλήξεις σωστά: .gov = κυβέρνηση, .edu = εκπαίδευση, .org = οργανισμός, .com = εταιρεία!");
    }
  } else {
    setError("✗ Αυτή η σημασία δεν ταιριάζει με την κατάληξη που διάλεξες! Ξανασκέψου το.");
  }
}

}

function checkSiteFact(id) {
  var el = document.getElementById(id);

  }
}
