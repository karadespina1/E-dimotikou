<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ψηφιακοί Πράκτορες — Μάθημα 17: Υπολογιστικό φύλλο</title>
<style>
:root{--paper:#F3ECD9;--card:#FFFDF7;--ink:#1F3C63;--ink2:#3C5A85;--gold:#C98A2B;--gold2:#E7C583;--good:#3F7A4E;--goodbg:#E1F0E3;--bad:#B8483D;--badbg:#F7E2DF;--line:#D8CBAA;}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:#2B2A28;font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;padding:18px 14px 50px}
.wrap{max-width:940px;margin:0 auto}
header{display:flex;align-items:center;gap:16px;padding:18px 22px;background:var(--ink);color:var(--paper);border-radius:14px}
.badge{width:54px;height:54px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;color:var(--ink);border:3px solid var(--paper);flex:0 0 auto}
header h1{margin:0;font-size:clamp(18px,4vw,26px)}header p{margin:4px 0 0;opacity:.85;font-size:13.5px}
#home{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:20px}
.mc{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:.15s}
.mc:hover{border-color:var(--gold);transform:translateY(-2px)}
.mc .n{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;background:var(--ink);color:var(--paper);border-radius:50%;font-size:13px;font-weight:bold;margin-bottom:8px}
.mc h3{margin:0 0 4px;font-size:15px;color:var(--ink)}.mc p{margin:0 0 8px;font-size:12.5px;color:var(--ink2)}
.st{font-size:15px;color:var(--gold);letter-spacing:1px}
#view{display:none;background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:20px;margin-top:20px}
#view.on{display:block}
.back{background:none;border:2px solid var(--ink);color:var(--ink);padding:6px 14px;border-radius:8px;font-weight:bold;cursor:pointer;font-family:inherit;margin-bottom:12px}
h2{margin:0 0 4px;color:var(--ink);font-size:20px}
.lvs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.lv{padding:8px 14px;border-radius:8px;border:2px solid var(--line);background:#FBFAF6;cursor:pointer;font-weight:bold;font-size:13px;font-family:inherit;color:var(--ink)}
.lv.cur{border-color:var(--gold);background:var(--gold2)}.lv:disabled{opacity:.45;cursor:not-allowed}
.goal{background:#FBF7EC;border-left:4px solid var(--gold);padding:8px 12px;border-radius:6px;font-size:13.5px;color:var(--ink2);margin-bottom:14px}
button.action{font-family:inherit;background:var(--ink);color:var(--paper);border:none;padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:bold;cursor:pointer;margin:6px 6px 0 0}
button.action:hover{background:var(--ink2)}button.action.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.task{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:14px}.tm{float:right;color:var(--gold2)}
.fb{min-height:22px;margin:8px 0;font-weight:bold;font-size:14px}.good{color:var(--good)}.bad{color:var(--bad)}
.qp{font-size:12px;color:var(--ink2);margin-bottom:4px}.qt{font-weight:bold;font-size:15px;margin-bottom:10px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{padding:9px 14px;border-radius:8px;border:2px solid var(--line);background:#FBFAF6;cursor:pointer;font-size:13.5px}
.opt:hover{border-color:var(--gold)}.opt.correct{border-color:var(--good);background:var(--goodbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.expl{margin-top:10px;font-size:13.5px;color:var(--ink2)}
.res{margin-top:16px;padding:14px;border-radius:10px;background:var(--goodbg);color:var(--good);font-weight:bold}
.big{font-size:24px;color:var(--gold)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{padding:9px 14px;border-radius:8px;background:#FBFAF6;border:2px solid var(--line);cursor:pointer;font-weight:bold;font-size:13.5px}
.chip.sel{border-color:var(--gold);background:var(--gold2)}
.bks{display:flex;gap:14px;flex-wrap:wrap}.bk{flex:1 1 220px;min-height:90px;border:2px dashed var(--line);border-radius:10px;padding:10px;background:#FBF7EC;cursor:pointer}
.bk h4{margin:0 0 6px;color:var(--ink);font-size:14px}.bk .p{display:inline-block;background:var(--goodbg);border-radius:6px;padding:4px 10px;margin:3px;font-size:13px}
.ol{display:flex;flex-direction:column;gap:8px}.oi{padding:10px 14px;border:2px solid var(--line);border-radius:8px;background:#FBFAF6;cursor:pointer;font-size:14px}.oi.fx{border-color:var(--good);background:var(--goodbg);cursor:default}
.sp{display:flex;gap:18px;flex-wrap:wrap}.sp>div{flex:1 1 300px}.sp h4{margin:0 0 6px;font-size:13px;color:var(--ink2)}
/* sheet */
.sh{position:relative;border:1px solid #b9c1cc;border-radius:6px;background:#fff;overflow:hidden;font-size:13.5px}
.bars{display:flex;gap:4px;align-items:center;padding:5px;background:#f3f5f8;border-bottom:1px solid #cfd5dd}
.nb{width:70px;text-align:center;background:#fff;border:1px solid #b9c1cc;border-radius:4px;padding:4px;font-weight:bold;cursor:pointer}
.ib{flex:1;border:1px solid #b9c1cc;border-radius:4px;padding:5px 8px;font:inherit;min-width:0}
.bars button{border:1px solid #b9c1cc;background:#fff;border-radius:4px;cursor:pointer;padding:3px 8px;font-weight:bold}.okb{color:var(--good)}.xb{color:var(--bad)}
.gw{overflow:auto;max-width:100%;outline:none}
.grid{border-collapse:collapse;table-layout:fixed}
.grid th{background:#eef1f5;border:1px solid #cfd5dd;font-weight:bold;color:#445;height:26px;position:relative;cursor:pointer;user-select:none}
.grid th.sel{background:#d4dff0}
.grid td{border:1px solid #dfe3e8;padding:0;height:26px;touch-action:none;user-select:none;cursor:cell}
.cv{height:26px;line-height:26px;padding:0 6px;overflow:hidden;white-space:nowrap;text-align:left}.cv.num{text-align:right}
td.in{background:#d9e6fb}td.mk{background:var(--gold2)}td.ok{background:var(--goodbg)}td.no{background:var(--badbg)}
td.act{box-shadow:inset 0 0 0 2px #111}
td input.ci{width:100%;height:26px;border:0;padding:0 6px;font:inherit;outline:2px solid #111}
.rz{position:absolute;right:-3px;top:0;width:7px;height:100%;cursor:col-resize;z-index:2;touch-action:none}
.rz:hover{background:var(--gold)}
.menu{position:absolute;background:#fff;border:1px solid #888;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:9;min-width:150px;font-size:13px}
.menu div{padding:7px 12px;cursor:pointer}.menu div:hover{background:var(--gold2)}
.meas{position:absolute;visibility:hidden;white-space:nowrap;font:13.5px "Trebuchet MS",sans-serif}
</style>
</head>
<body>
<div class="wrap">
<header><div class="badge">17</div><div><h1>Ψηφιακοί Πράκτορες</h1><p>Μάθημα 17ο · Υπολογιστικό φύλλο: Οργάνωση δεδομένων σε πίνακα — Ε΄ Δημοτικού</p></div></header>
<div id="home"></div>
<div id="view"><button class="back" id="bk">← Πίσω στις αποστολές</button><h2 id="vt"></h2><div class="lvs" id="lvs"></div><div class="goal" id="goal"></div><div id="box"></div></div>
</div>
<script>
const sh=a=>[...a].sort(()=>Math.random()-.5);
const L=i=>String.fromCharCode(64+i);
const isNum=v=>/^-?\d+([.,]\d+)?$/.test(String(v).trim());
const nrm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
const rgName=g=>{const a=L(g.c1)+g.r1,b=L(g.c2)+g.r2;return a===b?a:a+":"+b};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

/* ================= ENGINE: SPREADSHEET ================= */
function mkSheet(el,o){
  const S={cols:o.cols||6,rows:o.rows||6,d:{...(o.data||{})},w:{...(o.w||{})},dw:o.dw||90,act:o.active||"A1",rg:o.rg||null,mk:o.mark||[],ok:[],no:[],ed:null,drag:false,anchor:null,rzd:null};
  const ro=!!o.readonly, emit=e=>o.on&&o.on(e,S);
  S.W=c=>S.w[L(c)]||S.dw;
  S.need=c=>{let m=0;for(let r=1;r<=S.rows;r++){const v=S.d[L(c)+r];if(v){const s=document.createElement("span");s.className="meas";s.textContent=v;document.body.appendChild(s);m=Math.max(m,s.offsetWidth+18);s.remove()}}return m};
  function applyW(){el.querySelectorAll("col").forEach((c,i)=>{if(i>0)c.style.width=S.W(i)+"px"});let t=38;for(let c=1;c<=S.cols;c++)t+=S.W(c);el.querySelector(".grid").style.width=t+"px"}
  function build(){
    let h='<div class="sh">';
    if(!o.hideBars)h+=`<div class="bars"><div class="nb"></div><button class="xb" title="Ακύρωση">✕</button><button class="okb" title="Οριστικοποίηση">✓</button><input class="ib" placeholder="Γραμμή εισαγωγής"${ro?" readonly":""}></div>`;
    h+='<div class="gw" tabindex="0"><table class="grid"><colgroup><col style="width:38px">';
    for(let c=1;c<=S.cols;c++)h+=`<col style="width:${S.W(c)}px">`;
    h+='</colgroup><thead><tr><th></th>';
    for(let c=1;c<=S.cols;c++)h+=`<th class="ch" data-c="${c}">${L(c)}<i class="rz" data-c="${c}"></i></th>`;
    h+='</tr></thead><tbody>';
    for(let r=1;r<=S.rows;r++){h+=`<tr><th class="rh" data-r="${r}">${r}</th>`;for(let c=1;c<=S.cols;c++)h+=`<td data-c="${c}" data-r="${r}"><div class="cv"></div></td>`;h+="</tr>"}
    h+='</tbody></table></div><div class="menu" hidden></div></div>';
    el.innerHTML=h;applyW();fill();paint();
  }
  function fill(){el.querySelectorAll("td").forEach(td=>{if(td.querySelector("input"))return;const v=S.d[L(+td.dataset.c)+td.dataset.r]||"";const cv=td.firstChild;cv.textContent=v;cv.className="cv"+(v&&isNum(v)?" num":"")})}
  function paint(){
    const m=S.act.match(/^([A-Z])(\d+)$/),ac=m[1].charCodeAt(0)-64,ar=+m[2],g=S.rg,multi=g&&!(g.c1===g.c2&&g.r1===g.r2);
    el.querySelectorAll("td").forEach(td=>{const c=+td.dataset.c,r=+td.dataset.r,ref=L(c)+r;
      td.classList.toggle("act",ref===S.act);
      td.classList.toggle("in",!!multi&&c>=g.c1&&c<=g.c2&&r>=g.r1&&r<=g.r2);
      td.classList.toggle("mk",S.mk.includes(ref));td.classList.toggle("ok",S.ok.includes(ref));td.classList.toggle("no",S.no.includes(ref))});
    el.querySelectorAll(".ch").forEach(t=>t.classList.toggle("sel",+t.dataset.c===ac));
    el.querySelectorAll(".rh").forEach(t=>t.classList.toggle("sel",+t.dataset.r===ar));
    const nb=el.querySelector(".nb");if(nb)nb.textContent=multi?rgName(g):S.act;
    const ib=el.querySelector(".ib");if(ib&&!S.ed)ib.value=S.d[S.act]||"";
  }
  function commit(val){const e=S.ed;if(!e)return;S.ed=null;if(val===""||val==null)delete S.d[e.ref];else S.d[e.ref]=val;
    if(e.mode==="cell"){const td=el.querySelector(`td[data-c="${e.ref.charCodeAt(0)-64}"][data-r="${e.ref.slice(1)}"]`);td.innerHTML='<div class="cv"></div>'}
    fill();paint();const ib=el.querySelector(".ib");if(ib)ib.blur();emit({type:"commit",ref:e.ref,val:S.d[e.ref]||""})}
  function cancel(){const e=S.ed;if(!e)return;S.ed=null;if(e.mode==="cell"){const td=el.querySelector(`td[data-c="${e.ref.charCodeAt(0)-64}"][data-r="${e.ref.slice(1)}"]`);td.innerHTML='<div class="cv"></div>'}fill();paint();const ib=el.querySelector(".ib");if(ib)ib.blur()}
  function cellEdit(ref,first){
    if(ro||S.ed)return;S.act=ref;S.rg=null;paint();
    const td=el.querySelector(`td[data-c="${ref.charCodeAt(0)-64}"][data-r="${ref.slice(1)}"]`);
    td.innerHTML='<input class="ci">';const i=td.firstChild;i.value=first!=null?first:(S.d[ref]||"");S.ed={ref,mode:"cell"};i.focus();
    i.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();commit(i.value)}else if(e.key==="Escape")cancel()};
    i.onblur=()=>{if(S.ed&&S.ed.mode==="cell")commit(i.value)};
  }
  function menuOpen(kind,idx,e){
    if(!o.menu||!o.menu[kind])return;if(e.preventDefault)e.preventDefault();
    const m=el.querySelector(".menu");m.innerHTML=o.menu[kind].map((it,i)=>`<div data-i="${i}">${it[0]}</div>`).join("");
    const b=el.querySelector(".sh").getBoundingClientRect();m.style.left=(e.clientX-b.left)+"px";m.style.top=(e.clientY-b.top)+"px";m.hidden=false;m._k=kind;m._x=idx;
  }
  S.insRow=n=>{const nd={};for(const k in S.d){const m=k.match(/^([A-Z])(\d+)$/),r=+m[2];nd[m[1]+(r>=n?r+1:r)]=S.d[k]}S.d=nd;S.rows++;build();emit({type:"insert",kind:"row",idx:n})};
  S.insCol=n=>{const nd={};for(const k in S.d){const m=k.match(/^([A-Z])(\d+)$/),c=m[1].charCodeAt(0)-64;nd[L(c>=n?c+1:c)+m[2]]=S.d[k]}S.d=nd;const nw={};for(const k in S.w){const c=k.charCodeAt(0)-64;nw[L(c>=n?c+1:c)]=S.w[k]}S.w=nw;S.cols++;build();emit({type:"insert",kind:"col",idx:n})};
  S.rebuild=build;
  el.addEventListener("pointerdown",e=>{
    const rz=e.target.closest(".rz");if(rz){S.rzd={c:+rz.dataset.c,x:e.clientX,w:S.W(+rz.dataset.c)};e.preventDefault();return}
    const td=e.target.closest("td");if(!td||S.ed||o.fixed)return;
    S.anchor=[+td.dataset.c,+td.dataset.r];S.drag=true;S.rg=null;S.act=L(S.anchor[0])+S.anchor[1];paint();
  });
  const mv=e=>{if(!el.isConnected){off();return}
    if(S.rzd){S.w[L(S.rzd.c)]=Math.max(30,Math.round(S.rzd.w+e.clientX-S.rzd.x));applyW();return}
    if(!S.drag)return;const t=document.elementFromPoint(e.clientX,e.clientY),td=t&&t.closest&&t.closest("td");if(!td||!el.contains(td))return;
    const c=+td.dataset.c,r=+td.dataset.r;S.rg={c1:Math.min(c,S.anchor[0]),c2:Math.max(c,S.anchor[0]),r1:Math.min(r,S.anchor[1]),r2:Math.max(r,S.anchor[1])};paint()};
  const up=()=>{if(S.rzd){S.rzd=null;emit({type:"resize"});return}
    if(!S.drag)return;S.drag=false;const g=S.rg||{c1:S.anchor[0],c2:S.anchor[0],r1:S.anchor[1],r2:S.anchor[1]};emit({type:"range",rg:g,name:rgName(g)})};
  const off=()=>{document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up)};
  document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up);
  el.addEventListener("click",e=>{
    const m=el.querySelector(".menu");
    if(e.target.closest(".menu")){const it=e.target.closest("[data-i]");if(it){const f=o.menu[m._k][+it.dataset.i][1];m.hidden=true;f(m._x,S)}return}
    if(m)m.hidden=true;
    if(e.target.closest(".rz"))return;
    let t;
    if(t=e.target.closest("td"))emit({type:"cell",ref:L(+t.dataset.c)+t.dataset.r});
    else if(t=e.target.closest(".ch")){emit({type:"col",c:+t.dataset.c});menuOpen("col",+t.dataset.c,e)}
    else if(t=e.target.closest(".rh")){emit({type:"row",r:+t.dataset.r});menuOpen("row",+t.dataset.r,e)}
    else if(e.target.closest(".nb"))emit({type:"name"});
    else if(e.target.closest(".okb"))commit(el.querySelector(".ib").value);
    else if(e.target.closest(".xb"))cancel();
  });
  el.addEventListener("contextmenu",e=>{let t;if(t=e.target.closest(".rh"))menuOpen("row",+t.dataset.r,e);else if(t=e.target.closest(".ch"))menuOpen("col",+t.dataset.c,e)});
  el.addEventListener("dblclick",e=>{const rz=e.target.closest(".rz");if(rz){const c=+rz.dataset.c;S.w[L(c)]=Math.max(30,S.need(c));applyW();emit({type:"resize"});return}
    const td=e.target.closest("td");if(td)cellEdit(L(+td.dataset.c)+td.dataset.r)});
  el.addEventListener("focusin",e=>{if(e.target.classList.contains("ib")){emit({type:"input"});if(!ro&&!S.ed)S.ed={ref:S.act,mode:"bar"}}});
  el.addEventListener("input",e=>{if(e.target.classList.contains("ib")&&S.ed&&S.ed.mode==="bar"){const td=el.querySelector(`td[data-c="${S.ed.ref.charCodeAt(0)-64}"][data-r="${S.ed.ref.slice(1)}"]`);td.firstChild.textContent=e.target.value}});
  el.addEventListener("keydown",e=>{
    if(e.target.classList.contains("ib")){if(e.key==="Enter"){e.preventDefault();commit(e.target.value)}else if(e.key==="Escape")cancel();return}
    if(e.target.classList.contains("ci"))return;
    if(ro||o.fixed||S.ed)return;
    const m=S.act.match(/^([A-Z])(\d+)$/);let c=m[1].charCodeAt(0)-64,r=+m[2],mvd=false;
    if(e.key==="ArrowRight"){c=Math.min(S.cols,c+1);mvd=true}else if(e.key==="ArrowLeft"){c=Math.max(1,c-1);mvd=true}else if(e.key==="ArrowDown"){r=Math.min(S.rows,r+1);mvd=true}else if(e.key==="ArrowUp"){r=Math.max(1,r-1);mvd=true}
    if(mvd){e.preventDefault();S.act=L(c)+r;S.rg=null;paint();return}
    if(e.key.length===1&&!e.ctrlKey&&!e.metaKey){e.preventDefault();cellEdit(S.act,e.key)}
  });
  build();return S;
}

/* ================= ENGINES: QUIZ, TASKS, SORT, ORDER, FILL ================= */
function quiz(el,qs,d){
  let i=0,sc=0;
  const go=()=>{const q=qs[i],os=sh(q.o.map((t,k)=>({t,ok:k===q.c})));
    el.innerHTML=`<div class="qp">Ερώτηση ${i+1}/${qs.length}</div><div class="qt">${q.q}</div><div class="qx"></div><div class="opts">${os.map((o,k)=>`<div class="opt" data-k="${k}">${o.t}</div>`).join("")}</div><div class="expl" hidden></div><button class="action nx" hidden></button>`;
    if(q.sheet)q.sheet(el.querySelector(".qx"));
    let ans=false;
    el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(ans)return;ans=true;const o=os[+b.dataset.k];if(o.ok)sc++;b.classList.add(o.ok?"correct":"wrong");
      el.querySelectorAll(".opt").forEach(x=>{if(os[+x.dataset.k].ok)x.classList.add("correct")});
      const e=el.querySelector(".expl");e.hidden=false;e.textContent=(o.ok?"✓ Σωστά! ":"✗ ")+(q.e||"");
      const n=el.querySelector(".nx");n.hidden=false;n.textContent=i===qs.length-1?"Τέλος ▶":"Επόμενη ▶";n.onclick=()=>{i++;i<qs.length?go():d(sc,qs.length)}});
  };go();
}
function clickTasks(el,so,tasks,d,timer){
  let i=0,mis=0,t0=Date.now(),iv;
  el.innerHTML='<div class="task"></div><div class="mnt"></div><div class="fb"></div>';
  const tk=el.querySelector(".task"),fb=el.querySelector(".fb");
  const show=()=>{tk.innerHTML=`<b>${i+1}/${tasks.length}</b> ${tasks[i].t}`+(timer?' <span class="tm"></span>':"")};show();
  if(timer)iv=setInterval(()=>{if(!el.isConnected){clearInterval(iv);return}const s=el.querySelector(".tm");if(s)s.textContent="⏱ "+Math.floor((Date.now()-t0)/1000)+"″"},500);
  mkSheet(el.querySelector(".mnt"),{...so,on:ev=>{
    if(i>=tasks.length)return;const T=tasks[i];
    if(!(T.ty||["cell","col","row","name","input"]).includes(ev.type))return;
    if(T.ok(ev)){fb.textContent="✓ Σωστά!";fb.className="fb good";i++;
      if(i>=tasks.length){clearInterval(iv);tk.innerHTML="🎉 Τέλος!"+(timer?" Χρόνος: "+Math.floor((Date.now()-t0)/1000)+"″":"");d(Math.max(0,tasks.length-mis),tasks.length)}else show()}
    else{mis++;fb.textContent="✗ Όχι ακόμα — ξαναδοκίμασε!";fb.className="fb bad"}
  }});
}
function sort2(el,A,B,items,d){
  let sel=null,mis=0,left=items.length;
  el.innerHTML=`<div class="chips"></div><div class="bks"><div class="bk" data-k="A"><h4>${A}</h4></div><div class="bk" data-k="B"><h4>${B}</h4></div></div><div class="fb"></div>`;
  const ch=el.querySelector(".chips"),fb=el.querySelector(".fb");
  sh(items).forEach(([t,k])=>{const c=document.createElement("div");c.className="chip";c.textContent=t;c.onclick=()=>{el.querySelectorAll(".chip").forEach(x=>x.classList.remove("sel"));c.classList.add("sel");sel={c,t,k}};ch.appendChild(c)});
  el.querySelectorAll(".bk").forEach(b=>b.onclick=()=>{
    if(!sel){fb.textContent="Πρώτα διάλεξε ένα στοιχείο από πάνω.";fb.className="fb";return}

   {q:"Πού εμφανίζεται ό,τι πληκτρολογείς;",o:["Στο ενεργό κελί και στη γραμμή εισαγωγής","Μόνο στην οθόνη του ποντικιού","Στο όνομα της στήλης","Πουθενά"],c:0,e:"Και στο κελί και στη γραμμή εισαγωγής."},
   {q:"Η λέξη είναι πιο μεγάλη από το κελί. Τι κάνουμε;",o:["Μεγαλώνουμε τη στήλη","Σβήνουμε τη λέξη","Κλείνουμε το φύλλο","Αλλάζουμε γραμμή"],c:0,e:"Σύρουμε ή κάνουμε διπλό κλικ στην κάθετη γραμμή μετά το όνομα της στήλης."},
   {q:"Ποιο κουμπί ακυρώνει μια διόρθωση στη γραμμή εισαγωγής;",o:["Χ","✓","Enter","Κανένα"],c:0,e:"Το Χ ακυρώνει, το ✓ οριστικοποιεί."},
   {q:"Πώς εισάγουμε νέα γραμμή;",o:["Δεξί κλικ στο όνομα της γραμμής → «Εισαγωγή γραμμής»","Δεξί κλικ στο ποντίκι","Πατάμε Esc","Σβήνουμε μια γραμμή"],c:0,e:"Δεξί κλικ στο όνομα γραμμής και επιλογή «Εισαγωγή γραμμής»."},
   {q:"Πού στοιχίζονται αυτόματα οι αριθμοί;",o:["Δεξιά","Αριστερά","Στο κέντρο","Δεν στοιχίζονται"],c:0,e:"Οι αριθμοί δεξιά, οι λέξεις αριστερά."}],d)},
 {n:"Δύσκολο",g:"Για πραγματικούς πράκτορες!",run:(el,d)=>quiz(el,[
   {q:"Ποια κελιά ανήκουν στην περιοχή A2:B3;",o:["A2, A3, B2, B3","A2, B3","A2, A3, A4, B3","A2, B2"],c:0,e:"Είναι γειτονικά κελιά: 2 στήλες × 2 γραμμές."},
   {q:"Πώς επιλέγεις την περιοχή A2:B3;",o:["Κλικ στο A2 και σύρσιμο διαγώνια ως το B3","Κλικ μόνο στο B3","Διπλό κλικ στο A1","Πατάς Enter δύο φορές"],c:0,e:"Κλικ στο πρώτο κελί και σύρσιμο ως το τελευταίο."},
   {q:"Πόσα κελιά έχει η περιοχή A1:C2;",o:["6","3","4","5"],c:0,e:"3 στήλες (A, B, C) × 2 γραμμές = 6 κελιά."},
   {q:"Στον πίνακα της εκδρομής, τι γράφουμε στο κελί A1;",o:["Τον τίτλο (επικεφαλίδα) του πίνακα","Το πλήθος των παιδιών","Τον κωδικό","Τίποτα"],c:0,e:"Στο A1 γράφουμε τον τίτλο του πίνακα."},
   {q:"Πώς ονομάζεται το κελί στη στήλη D και γραμμή 7;",o:["D7","7D","D-7","Δ7"],c:0,e:"Λατινικό γράμμα στήλης και αριθμός γραμμής: D7."},
   {q:"Ποια είναι η σωστή σειρά για να διορθώσεις ένα λάθος;",o:["Διπλό κλικ στο κελί → διορθώνω → Enter ή ✓","Enter → διπλό κλικ → διορθώνω","Σβήνω τη στήλη → ξαναγράφω","Κλείνω και ανοίγω το πρόγραμμα"],c:0,e:"Διπλό κλικ, διόρθωση και οριστικοποίηση με ✓ ή Enter."}],d)}]}
];

/* insert row/col interactive task */
function insTask(el,total,d){
  const init={A1:"Αρχαιολογικό Μουσείο",B1:"12",A2:"Πινακοθήκη",B2:"9"};
  el.innerHTML='<div class="task"></div><div class="mnt"></div><div class="fb"></div><button class="action alt">↺ Επαναφορά</button>';
  const tk=el.querySelector(".task"),fb=el.querySelector(".fb");let wrong=0,fin=false,S;
  const stage=()=>{const d=S.d,r1=!["A1","B1","C1","D1"].some(k=>d[k]);
    let s=0;if(d.A2==="Αρχαιολογικό Μουσείο"&&r1){s=1;if(d.A1){s=2;if(total===4&&S.d.C2==="12"&&!d.B2){s=3;if(d.B1)s=4}}}return s};
  const msgs=["Κάνε δεξί κλικ (ή πάτα) στο όνομα της <b>γραμμής 1</b> → «Εισαγωγή γραμμής».","Γράψε έναν <b>τίτλο</b> στο νέο κελί <b>A1</b> (π.χ. «Επιλογές»).","Κάνε δεξί κλικ (ή πάτα) στο όνομα της <b>στήλης B</b> → «Εισαγωγή στήλης».","Γράψε μια <b>επικεφαλίδα</b> στο κελί <b>B1</b> της νέας στήλης (π.χ. «Ημέρα»)."];
  const chk=()=>{const s=stage();if(s>=total){tk.innerHTML="🎉 Τέλος!";fb.textContent="Τέλεια! Το φύλλο οργανώθηκε.";fb.className="fb good";if(!fin){fin=true;d(Math.max(0,total-wrong),total)}}else tk.innerHTML=`<b>${s+1}/${total}</b> ${msgs[s]}`};
  const start=()=>{S=mkSheet(el.querySelector(".mnt"),{cols:4,rows:5,dw:150,w:{B:70},data:{...init},
    menu:{row:[["Αντιγραφή",()=>{fb.textContent="Όχι αυτό — ψάξε «Εισαγωγή γραμμής».";fb.className="fb bad"}],["Εισαγωγή γραμμής",(i,S)=>S.insRow(i)]],col:[["Αντιγραφή",()=>{fb.textContent="Όχι αυτό — ψάξε «Εισαγωγή στήλης».";fb.className="fb bad"}],["Εισαγωγή στήλης",(i,S)=>S.insCol(i)]]},
    on:e=>{if(e.type==="insert"){const s=stage();if(!((e.kind==="row"&&e.idx===1)||(e.kind==="col"&&e.idx===2))||(e.kind==="col"&&s<2)){wrong++;fb.textContent="Η εισαγωγή έγινε σε λάθος θέση ή σειρά. Πάτα «Επαναφορά» και ξαναδοκίμασε.";fb.className="fb bad"}else{fb.textContent="✓ Σωστά!";fb.className="fb good"}}
      if(e.type==="insert"||e.type==="commit")chk()}});chk()};
  start();el.querySelector(".action").onclick=()=>{if(!fin)wrong++;fb.textContent="";start()};
}

/* ================= APP SHELL ================= */
let prog={};try{prog=JSON.parse(localStorage.getItem("m17")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("m17",JSON.stringify(prog))}catch(e){}};
const stars=(n)=>"★".repeat(n)+"☆".repeat(3-n);
const home=document.getElementById("home"),view=document.getElementById("view");
function drawHome(){home.innerHTML="";ACTS.forEach((a,i)=>{const p=prog[i]||[0,0,0],c=document.createElement("div");c.className="mc";
  c.innerHTML=`<span class="n">${i+1}</span><h3>${a.t}</h3><p>${a.d}</p><div class="st">${p.map(x=>stars(x)).join(" ")}</div>`;c.onclick=()=>openAct(i);home.appendChild(c)})}
let cur=0;
function openAct(i){cur=i;home.style.display="none";view.classList.add("on");document.getElementById("vt").textContent=`Αποστολή ${i+1}: ${ACTS[i].t}`;drawLevels();startLevel(i,0)}
function drawLevels(l){const p=prog[cur]||[0,0,0],w=document.getElementById("lvs");w.innerHTML="";
  ACTS[cur].lv.forEach((lv,k)=>{const b=document.createElement("button");b.className="lv"+(k===l?" cur":"");b.disabled=k>0&&!p[k-1];b.textContent=`Επίπεδο ${k+1}: ${lv.n} ${p[k]?stars(p[k]):""}`;b.onclick=()=>startLevel(cur,k);w.appendChild(b)})}
function startLevel(a,l){cur=a;drawLevels(l);const lv=ACTS[a].lv[l],box=document.getElementById("box");document.getElementById("goal").textContent=lv.g;
  const nb=document.createElement("div");box.replaceWith(nb);nb.id="box";
  lv.run(nb,(sc,tot)=>{const pc=tot?sc/tot:1,s=pc>=.9?3:pc>=.6?2:1;prog[a]=prog[a]||[0,0,0];prog[a][l]=Math.max(prog[a][l],s);save();drawLevels(l);
    const r=document.createElement("div");r.className="res";const more=l<ACTS[a].lv.length-1;
    r.innerHTML=`Αποτέλεσμα: <span class="big">${stars(s)}</span> (${sc}/${tot})<br>`;
    const b1=document.createElement("button");b1.className="action alt";b1.textContent="↺ Ξανά";b1.onclick=()=>startLevel(a,l);r.appendChild(b1);
    if(more){const b2=document.createElement("button");b2.className="action";b2.textContent="Επόμενο επίπεδο ▶";b2.onclick=()=>startLevel(a,l+1);r.appendChild(b2)}
    else if(a<ACTS.length-1){const b2=document.createElement("button");b2.className="action";b2.textContent="Επόμενη αποστολή ▶";b2.onclick=()=>openAct(a+1);r.appendChild(b2)}
    nb.appendChild(r);r.scrollIntoView({behavior:"smooth",block:"nearest"})});}
document.getElementById("bk").onclick=()=>{view.classList.remove("on");home.style.display="";drawHome()};
drawHome();
</script>
