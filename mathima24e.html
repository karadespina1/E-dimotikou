<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Κουίζ - Μάθημα 24: Εντυπωσιακές Παρουσιάσεις</title>
<style>
:root{
  --bg:#f3e8ff;
  --card-bg:#ffffff;
  --primary:#7e22ce;
  --primary-hover:#6b21a8;
  --accent:#ec4899;
  --text:#1e1b4b;
  --text-muted:#6b21a8;
  --success:#15803d;
  --success-bg:#dcfce7;
  --error:#b91c1c;
  --error-bg:#fee2e2;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Segoe UI',system-ui,sans-serif;
  padding:16px 12px 50px;
  font-size:18px;
}
.container{max-width:820px;margin:0 auto}

/* HEADER */
.header-box{
  background:linear-gradient(135deg, #7e22ce 0%, #a855f7 50%, #ec4899 100%);
  color:#fff;
  border-radius:20px;
  padding:24px 20px;
  text-align:center;
  box-shadow:0 8px 24px rgba(126,34,206,.25);
  margin-bottom:20px;
}
.header-box h1{margin:0;font-size:26px;font-weight:900}
.header-box p{margin:8px 0 0;font-size:16px;opacity:.95}

/* MENU GRID */
#menuView{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.topic-card{
  background:#fff;
  border:3px solid #e9d5ff;
  border-radius:18px;
  padding:20px;
  cursor:pointer;
  transition:all .2s ease;
  box-shadow:0 4px 14px rgba(0,0,0,.05);
}
.topic-card:hover{
  border-color:var(--accent);
  transform:translateY(-3px);
  box-shadow:0 10px 22px rgba(236,72,153,.2);
}
.topic-badge{
  display:inline-block;
  background:var(--primary);
  color:#fff;
  font-size:14px;
  font-weight:900;
  padding:4px 12px;
  border-radius:20px;
  margin-bottom:8px;
}
.topic-card h2{margin:6px 0;font-size:20px;color:#3b0764}
.topic-card p{margin:0;font-size:15px;color:#6b21a8;line-height:1.4}

/* QUIZ STAGE */
#quizView{
  background:#fff;
  border:3px solid #d8b4fe;
  border-radius:22px;
  padding:24px 20px;
  box-shadow:0 8px 30px rgba(0,0,0,.07);
}
.nav-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.btn-back{
  background:#f3e8ff;
  border:2px solid #c084fc;
  color:#581c87;
  padding:10px 18px;
  border-radius:12px;
  font-weight:900;
  cursor:pointer;
  font-size:16px;
}
.btn-back:hover{background:#e9d5ff}
.progress-tag{
  background:#fce7f3;
  color:#be185d;
  font-size:15px;
  font-weight:900;
  padding:6px 14px;
  border-radius:16px;
}

/* BIG READABLE QUESTION BOX */
.q-box{
  background:#faf5ff;
  border-left:8px solid var(--accent);
  border-radius:12px;
  padding:18px 20px;
  margin-bottom:22px;
}
.q-title{font-size:21px;font-weight:900;color:#3b0764;line-height:1.4}
.q-hint{font-size:15px;color:#7e22ce;margin-top:6px;font-style:italic}

/* BIG OPTIONS BUTTONS */
.options-list{display:flex;flex-direction:column;gap:14px}
.opt-btn{
  background:#ffffff;
  border:3px solid #e9d5ff;
  border-radius:16px;
  padding:16px 20px;
  font-size:18px;
  font-weight:800;
  text-align:left;
  cursor:pointer;
  transition:all .15s ease;
  line-height:1.35;
  color:#1e1b4b;
}
.opt-btn:hover{
  border-color:var(--primary);
  background:#faf5ff;
  transform:scale(1.01);
}
.opt-btn.correct{
  background:var(--success-bg) !important;
  border-color:var(--success) !important;
  color:var(--success) !important;
}
.opt-btn.wrong{
  background:var(--error-bg) !important;
  border-color:var(--error) !important;
  color:var(--error) !important;
}

/* FEEDBACK & NEXT */
.feedback-box{
  padding:16px 20px;
  border-radius:14px;
  font-size:17px;
  font-weight:800;
  line-height:1.45;
  margin-top:20px;
  display:none;
}
.feedback-box.good{background:var(--success-bg);color:#15803d;border:2px solid #86efac}
.feedback-box.bad{background:var(--error-bg);color:#b91c1c;border:2px solid #fca5a5}

.next-btn{
  background:linear-gradient(135deg, #7e22ce 0%, #ec4899 100%);
  color:#fff;
  border:none;
  padding:16px 28px;
  border-radius:16px;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  margin-top:16px;
  display:inline-block;
  box-shadow:0 6px 18px rgba(126,34,206,.3);
}
.next-btn:hover{opacity:.95}
</style>
</head>
<body>
<div class="container">
  <!-- HEADER -->
  <div class="header-box">
    <h1>📽️ Μάθημα 24: Μεγάλο Κουίζ Παρουσιάσεων</h1>
    <p>8 Ενότητες · 24 Ερωτήσεις (Τυχαία σειρά απαντήσεων) — Ε΄ Δημοτικού</p>
  </div>

  <!-- MENU VIEW -->
  <div id="menuView"></div>

  <!-- QUIZ VIEW -->
  <div id="quizView" style="display:none">
    <div class="nav-bar">
      <button class="btn-back" onclick="showMenu()">← Πίσω στο Μενού</button>
      <span class="progress-tag" id="progTag">Ερώτηση 1 / 3</span>
    </div>
    <div class="q-box">
      <div class="q-title" id="qText">Ερώτηση εδώ...</div>
      <div class="q-hint" id="qHint"></div>
    </div>
    <div class="options-list" id="optsList"></div>
    <div class="feedback-box" id="fbMsg"></div>
    <div id="nextArea"></div>
  </div>
</div>

<script>
var curTopic = 0;
var curQ = 0;
var hasAnswered = false;
var currentShuffledOpts = [];

var quizData = [
  // 1. Πρότυπα Διαφανειών (Templates)
  {
    title: "1. Τα Πρότυπα (Templates)",
    desc: "Χρώματα, γραφικά και ευανάγνωστα κείμενα.",
    questions: [
      {
        q: "Γιατί χρησιμοποιούμε έτοιμα πρότυπα στις παρουσιάσεις (σελ. 88);",
        hint: "Σκέψου πώς αλλάζει η εμφάνιση της εργασίας.",
        opts: [
          { t: "🎨 Για να προσθέσουμε όμορφα χρώματα και γραφικά εύκολα και γρήγορα!", ok: true, exp: "Σωστά! Με τα πρότυπα η παρουσίαση γίνεται όμορφη και ευανάγνωστη χωρίς να αλλάξει το περιεχόμενο (σελ. 88)." },
          { t: "❌ Για να σβηστούν όλα τα κείμενα που γράψαμε", ok: false, exp: "Λάθος! Το κείμενο παραμένει ίδιο, αλλάζει μόνο η εμφάνιση." },
          { t: "❌ Για να κλείσει αμέσως ο υπολογιστής", ok: false, exp: "Όχι, φυσικά!" }
        ]
      },
      {
        q: "Ποια είναι η σωστή διαδρομή στο μενού για να επιλέξεις πρότυπο (σελ. 90);",
        hint: "Κοίταξε τις επιλογές του μενού Αρχείο.",
        opts: [
          { t: "📁 Αρχείο ➔ Δημιουργία ➔ Πρότυπα", ok: true, exp: "Μπράβο! Εκεί ανοίγει το παράθυρο με όλα τα διαθέσιμα πρότυπα (σελ. 90)." },
          { t: "🗑️ Επεξεργασία ➔ Διαγραφή όλων", ok: false, exp: "Όχι, αυτό θα έσβηνε την εργασία!" },
          { t: "🔌 Βοήθεια ➔ Κλείσιμο", ok: false, exp: "Όχι." }
        ]
      },
      {
        q: "Τι πρέπει να προσέχουμε όταν διαλέγουμε ένα πρότυπο (σελ. 90);",
        hint: "Σκέψου αν το πρότυπο 'δένει' με το θέμα μας.",
        opts: [
          { t: "🌿 Να ταιριάζει με το θέμα της παρουσίασης (π.χ. θέμα φύσης για ζώα)!", ok: true, exp: "Τέλεια! Το πρότυπο πρέπει να ταιριάζει με το θέμα της εργασίας μας (σελ. 90)." },
          { t: "Να έχει όσο πιο πολλά περίεργα χρώματα γίνεται ακόμα κι αν κουράζει", ok: false, exp: "Όχι, γιατί τα πολλά χρώματα κουράζουν." }
        ]
      }
    ]
  },

  // 2. Διαχείριση Διαφανειών (Νέα, Διπλασιασμός, Διαγραφή)
  {
    title: "2. Διαχείριση Διαφανειών",
    desc: "Προσθήκη, διπλασιασμός και σειρά εμφάνισης.",
    questions: [
      {
        q: "Πώς προσθέτουμε μια Νέα Διαφάνεια στην παρουσίασή μας (σελ. 89);",
        hint: "Θυμήσου τη συντόμευση πληκτρολογίου.",
        opts: [
          { t: "➕ Δεξί κλικ στις διαφάνειες ➔ Νέα διαφάνεια (ή πλήκτρα Ctrl + M)!", ok: true, exp: "Σωστά! Με δεξί κλικ ή με Ctrl+M μπαίνει αμέσως νέα διαφάνεια (σελ. 89)." },
          { t: "Κλείνοντας τον υπολογιστή από το κουμπί", ok: false, exp: "Όχι!" },
          { t: "Πατώντας πολλές φορές το Space", ok: false, exp: "Όχι." }
        ]
      },
      {
        q: "Τι συμβαίνει όταν επιλέγουμε «Διπλασιασμός διαφάνειας» (σελ. 89);",
        hint: "Σκέψου τη λέξη 'διπλασιασμός'.",
        opts: [
          { t: "📑 Δημιουργείται ένα ολόιδιο αντίγραφο της διαφάνειας με ό,τι περιείχε!", ok: true, exp: "Μπράβο! Φτιάχνει πιστό αντίγραφο για να μην ξαναγράφουμε από την αρχή (σελ. 89)." },
          { t: "Η διαφάνεια γίνεται διπλάσια σε μέγεθος οθόνης", ok: false, exp: "Όχι, αντιγράφεται η διαφάνεια!" },
          { t: "Διαγράφεται οριστικά η διαφάνεια", ok: false, exp: "Όχι, αυτό γίνεται με τη Διαγραφή." }
        ]
      },
      {
        q: "Πώς αλλάζουμε τη σειρά εμφάνισης των διαφανειών (σελ. 89);",
        hint: "Χρησιμοποίησε το ποντίκι.",
        opts: [
          { t: "🖱️ Κρατάμε πατημένο το αριστερό κλικ και τη σέρνουμε στη νέα της θέση!", ok: true, exp: "Ακριβώς! Με απλό σύρσιμο (drag and drop) αλλάζουμε όποια σειρά θέλουμε (σελ. 89)." },
          { t: "Πρέπει να σβήσουμε τα πάντα και να τα ξαναφτιάξουμε", ok: false, exp: "Όχι, γίνεται πανεύκολα με σύρσιμο!" }
        ]
      }
    ]
  },

  // 3. Προβολή Παρουσίασης (F5 & Πλοήγηση)
  {
    title: "3. Προβολή Παρουσίασης (F5)",
    desc: "Πώς ξεκινάμε, πώς αλλάζουμε και πώς σταματάμε.",
    questions: [
      {
        q: "Ποιο πλήκτρο ξεκινάει την προβολή διαφανειών από την αρχή (σελ. 90);",
        hint: "Βρίσκεται στην πάνω σειρά του πληκτρολογίου.",
        opts: [
          { t: "⌨️ Το πλήκτρο F5!", ok: true, exp: "Σωστά! Το F5 ανοίγει αμέσως την προβολή σε πλήρη οθόνη (σελ. 90)." },
          { t: "Το πλήκτρο Esc", ok: false, exp: "Το Esc σταματάει την προβολή!" },
          { t: "Το πλήκτρο Shift", ok: false, exp: "Όχι." }
        ]
      },
      {
        q: "Πώς πηγαίνουμε στην επόμενη διαφάνεια κατά τη διάρκεια της προβολής;",
        hint: "Υπάρχουν δύο τρόποι (ποντίκι ή πληκτρολόγιο).",
        opts: [
          { t: "👉 Κάνοντας κλικ με το ποντίκι ή πατώντας το δεξί βέλος (➔)!", ok: true, exp: "Μπράβο! Κλικ ή δεξί βέλος για επόμενη, αριστερό βέλος για προηγούμενη (σελ. 90)." },
          { t: "Πατώντας το κουμπί σβησίματος του υπολογιστή", ok: false, exp: "Όχι!" }
        ]
      },
      {
        q: "Ποιο πλήκτρο πατάμε για να ΣΤΑΜΑΤΗΣΟΥΜΕ την προβολή (σελ. 90);",
        hint: "Σημαίνει 'διαφυγή' (Escape).",
        opts: [
          { t: "🛑 Το πλήκτρο Esc (Escape)!", ok: true, exp: "Τέλεια! Το Esc διακόπτει αμέσως την προβολή και επιστρέφει στο πρόγραμμα (σελ. 90)." },
          { t: "Το πλήκτρο Enter", ok: false, exp: "Το Enter προχωράει στην επόμενη διαφάνεια!" }
        ]
      }
    ]
  },

  // 4. Εφέ Εναλλαγής Διαφανειών (Transitions)
  {
    title: "4. Εφέ Εναλλαγής (Transitions)",
    desc: "Κινήσεις όταν αλλάζει η διαφάνεια.",
    questions: [
      {
        q: "Τι είναι το «εφέ εναλλαγής διαφανειών» (σελ. 90);",
        hint: "Φαίνεται στο πέρασμα από τη μία διαφάνεια στην άλλη.",
        opts: [
          { t: "🎬 Το οπτικό εφέ που φαίνεται καθώς περνάμε στην επόμενη διαφάνεια!", ok: true, exp: "Σωστά! Ζωντανεύει το πέρασμα από τη μία διαφάνεια στην άλλη (σελ. 90)." },
          { t: "Η αλλαγή της μπαταρίας", ok: false, exp: "Όχι." },
          { t: "Η διαγραφή των κειμένων", ok: false, exp: "Όχι." }
        ]
      },
      {
        q: "Από ποιο μενού προσθέτουμε εφέ εναλλαγής διαφανειών (σελ. 90);",
        hint: "Κοίταξε τη διαδρομή στη σελίδα 90.",
        opts: [
          { t: "⚙️ Προβολή ➔ Εναλλαγή διαφάνειας", ok: true, exp: "Μπράβο! Ανοίγει το δεξί πλαίσιο με όλα τα εφέ εναλλαγής (σελ. 90)." },
          { t: "Εργαλεία ➔ Αριθμομηχανή", ok: false, exp: "Όχι." }
        ]
      },
      {
        q: "Τι πατάμε αν θέλουμε ΟΛΕΣ οι διαφάνειες να έχουν το ίδιο εφέ (σελ. 90);",
        hint: "Υπάρχει ειδικό κουμπί.",
        opts: [
          { t: "✨ «Εφαρμογή μετάβασης σε όλες τις διαφάνειες»!", ok: true, exp: "Ακριβώς! Έτσι δεν χρειάζεται να το βάζουμε ξεχωριστά σε κάθε διαφάνεια (σελ. 90)." },
          { t: "«Διαγραφή όλων των διαφανειών»", ok: false, exp: "Όχι!" }
        ]
      }
    ]
  },

  // 5. Εφέ Κίνησης Αντικειμένων (Animations)
  {
    title: "5. Εφέ Κίνησης Αντικειμένων",
    desc: "Κινήσεις σε τίτλους, κείμενα και εικόνες.",
    questions: [
      {
        q: "Σε ποια στοιχεία μπορούμε να βάλουμε εφέ κίνησης (σελ. 91);",
        hint: "Σκέψου τι περιέχει μια διαφάνεια.",
        opts: [
          { t: "🦭 Σε κείμενα (τίτλους) και σε εικόνες!", ok: true, exp: "Σωστά! Μπορούμε να κάνουμε να κινούνται λέξεις και φωτογραφίες (σελ. 91)." },
          { t: "Μόνο στο καλώδιο του ρεύματος", ok: false, exp: "Όχι." }
        ]
      },
      {
        q: "Πώς βάζουμε κίνηση σε μια εικόνα (σελ. 91);",
        hint: "Πρώτα επιλέγουμε την εικόνα.",
        opts: [
          { t: "🎯 Επιλέγουμε την εικόνα και πάμε: Προβολή ➔ Κίνηση ➔ Προσθήκη Εφέ!", ok: true, exp: "Μπράβο! Διαλέγουμε το στοιχείο και μετά επιλέγουμε το εφέ κίνησης (σελ. 91)." },
          { t: "Κουνάμε την οθόνη με τα χέρια μας", ok: false, exp: "Όχι βέβαια!" }
        ]
      },
      {
        q: "Ποια είναι η διαφορά ανάμεσα στην Εναλλαγή και στην Κίνηση (σελ. 90-91);",
        hint: "Το ένα αλλάζει όλη τη σελίδα, το άλλο κινεί αντικείμενα.",
        opts: [
          { t: "🌟 Η Εναλλαγή αλλάζει όλη τη διαφάνεια, ενώ η Κίνηση κινεί συγκεκριμένα αντικείμενα!", ok: true, exp: "Τέλεια διάκριση! Αυτή είναι η βασική διαφορά του μαθήματος (σελ. 90-91)." },
          { t: "Είναι ακριβώς το ίδιο πράγμα", ok: false, exp: "Όχι, έχουν διαφορετικό ρόλο!" }
        ]
      }
    ]
  },

  // 6. Ο Κανόνας του Μέτρου (σελ. 92)
  {
    title: "6. Ο Κανόνας του Μέτρου",
    desc: "Γιατί η υπερβολή κουράζει το κοινό.",
    questions: [
      {
        q: "Τι μπορεί να συμβεί αν βάλουμε ΠΑΡΑ ΠΟΛΛΑ εφέ και κινήσεις (σελ. 92);",
        hint: "Διάβασε την προειδοποίηση στη σελίδα 92.",
        opts: [
          { t: "🥱 Η παρουσίαση γίνεται κουραστική και χάνεται το νόημα της εργασίας!", ok: true, exp: "Σωστά! Η υπερβολή ζαλίζει τους θεατές και αποσπά την προσοχή (σελ. 92)." },
          { t: "Η παρουσίαση γίνεται αυτόματα τέλεια", ok: false, exp: "Όχι, κουράζει το κοινό!" }
        ]
      },
      {
        q: "Πώς πρέπει να χρησιμοποιούμε τα εφέ σύμφωνα με το βιβλίο (σελ. 92);",
        hint: "Σκέψου τη λέξη 'μέτρο'.",
        opts: [
          { t: "👌 Με προσοχή και μέτρο, μόνο εκεί που χρειάζεται να τονίσουμε κάτι!", ok: true, exp: "Ακριβώς! Λίγα και κομψά εφέ κάνουν την εργασία ευχάριστη (σελ. 92)." },
          { t: "Να βάζουμε 10 εφέ σε κάθε λέξη", ok: false, exp: "Όχι!" }
        ]
      },
      {
        q: "Τι χρώμα γραμμάτων βάζουμε αν το φόντο της διαφάνειας είναι σκούρο μπλε;",
        hint: "Σκέψου την αντίθεση χρωμάτων.",
        opts: [
          { t: "💡 Ανοιχτό χρώμα (λευκό ή κίτρινο) για να διαβάζεται καθαρά!", ok: true, exp: "Μπράβο! Πρέπει πάντα να υπάρχει αντίθεση (contrast) για να διαβάζεται εύκολα!" },
          { t: "Μαύρα γράμματα για να μη φαίνονται", ok: false, exp: "Όχι, δεν θα διαβάζονται καθόλου!" }
        ]
      }
    ]
  },

  // 7. Σχεδιασμός Σχολικής Εργασίας (σελ. 88-89)
  {
    title: "7. Σχεδιασμός της Εργασίας",
    desc: "Τίτλος, περιεχόμενο και αναφορά πηγών.",
    questions: [
      {
        q: "Τι περιλαμβάνει συνήθως η πρώτη διαφάνεια μιας σχολικής εργασίας (σελ. 88);",
        hint: "Σκέψου πώς ξεκινάμε.",
        opts: [
          { t: "📌 Τον τίτλο της εργασίας και τα ονόματα των μαθητών της ομάδας!", ok: true, exp: "Σωστά! Είναι η διαφάνεια τίτλου που παρουσιάζει το θέμα και την ομάδα (σελ. 88)." },
          { t: "Μόνο τη λέξη ΤΕΛΟΣ", ok: false, exp: "Αυτό μπαίνει στην τελευταία διαφάνεια!" }
        ]
      },
      {
        q: "Όταν χρησιμοποιούμε κείμενα ή εικόνες από το διαδίκτυο, τι πρέπει να γράφουμε (σελ. 88-89);",
        hint: "Σκέψου την πνευματική ιδιοκτησία.",
        opts: [
          { t: "🔗 Την πηγή (το link ή το όνομα του ιστότοπου απ' όπου τα πήραμε)!", ok: true, exp: "Μπράβο! Πάντα αναφέρουμε τις πηγές μας με σεβασμό στους δημιουργούς (σελ. 88)." },
          { t: "Ότι τα ζωγραφίσαμε όλα μόνοι μας", ok: false, exp: "Όχι, πρέπει να αναφέρουμε την πηγή!" }
        ]
      },
      {
        q: "Ποια είναι η σωστή σειρά των διαφανειών σε μια σχολική παρουσίαση;",

        opts: [

// Fisher-Yates array shuffle so correct option is at a RANDOM position every time!
function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = a[i];
    a[i] = a[j];
    a[j] = temp;
  }
  return a;
}

function initMenu() {
  var m = document.getElementById("menuView");
  m.innerHTML = "";
  quizData.forEach(function(item, idx) {
    var c = document.createElement("div");
    c.className = "topic-card";
    c.onclick = function() { startTopic(idx); };
    c.innerHTML = '<span class="topic-badge">Ενότητα ' + (idx + 1) + '</span>' +
                  '<h2>' + item.title + '</h2>' +
                  '<p>' + item.desc + '</p>';
    m.appendChild(c);
  });
}

function showMenu() {
  document.getElementById("menuView").style.display = "grid";
  document.getElementById("quizView").style.display = "none";
}

function startTopic(idx) {
  curTopic = idx;
  curQ = 0;
  document.getElementById("menuView").style.display = "none";
  document.getElementById("quizView").style.display = "block";
  loadQuestion();
}

function loadQuestion() {
  hasAnswered = false;
  var topic = quizData[curTopic];
  var qData = topic.questions[curQ];

  document.getElementById("progTag").textContent = "Ερώτηση " + (curQ + 1) + " / " + topic.questions.length;
  document.getElementById("qText").textContent = qData.q;
  document.getElementById("qHint").textContent = qData.hint ? "💡 " + qData.hint : "";

  var fb = document.getElementById("fbMsg");
  fb.textContent = "";
  fb.style.display = "none";
  document.getElementById("nextArea").innerHTML = "";

  var optsBox = document.getElementById("optsList");
  optsBox.innerHTML = "";

  // SHUFFLE THE OPTIONS DYNAMICALLY! Correct answer will NOT always be first!
  currentShuffledOpts = shuffleArray(qData.opts);

  currentShuffledOpts.forEach(function(opt) {
    var btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.textContent = opt.t;
    btn.onclick = function() { checkAnswer(btn, opt); };
    optsBox.appendChild(btn);
  });
}

function checkAnswer(btn, opt) {
  if (hasAnswered) return;
  hasAnswered = true;

  var fb = document.getElementById("fbMsg");
  fb.style.display = "block";

  if (opt.ok) {
    btn.classList.add("correct");
    fb.className = "feedback-box good";
    fb.textContent = "🎉 ΣΩΣΤΟ! " + opt.exp;
  } else {
    btn.classList.add("wrong");
    fb.className = "feedback-box bad";
    fb.textContent = "✗ ΠΡΟΣΟΧΗ: " + opt.exp;
    // Highlight the correct option wherever it was placed after shuffle
    var buttons = document.querySelectorAll(".opt-btn");
    currentShuffledOpts.forEach(function(o, idx) {
      if (o.ok && buttons[idx]) buttons[idx].classList.add("correct");
    });
  }

  // Next Button
  var nextArea = document.getElementById("nextArea");
  var nb = document.createElement("button");
  nb.className = "next-btn";
  var topic = quizData[curTopic];

  if (curQ < topic.questions.length - 1) {
    nb.textContent = "Επόμενη Ερώτηση (" + (curQ + 2) + "/3) ▶";
    nb.onclick = function() {
      curQ++;
      loadQuestion();
    };
  } else if (curTopic < quizData.length - 1) {
    nb.textContent = "Επόμενη Ενότητα (" + (curTopic + 2) + "/8) ▶";
    nb.onclick = function() {
      curTopic++;
      curQ = 0;
      loadQuestion();
    };
  } else {
    nb.textContent = "🏆 Συγχαρητήρια! Τέλος Κουίζ! Επιστροφή στο Μενού";
    nb.onclick = showMenu;
  }
  nextArea.appendChild(nb);
}

initMenu();
</script>
